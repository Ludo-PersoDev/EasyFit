<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="allRoundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>
  
  <!-- Fond de l'icône -->
  <rect width="512" height="512" rx="115" fill="url(#allRoundGrad)" />
  
  <!-- Anneau central de la polyvalence -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="24" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="24" stroke-dasharray="700" stroke-dashoffset="180" stroke-linecap="round" />

  <!-- Groupe central -->
  <g transform="translate(256, 256)">
    <!-- 1. Ligne ECG / Cardio centrée en ARRIÈRE-PLAN -->
    <path d="M-130 0 L-80 0 L-45 -50 L-10 70 L25 -40 L60 40 L95 0 L130 0" 
          fill="none" 
          stroke="#34d399" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.9" />

    <!-- 2. Haltère au PREMIER PLAN -->
    <path d="M-110 -20 H110 V20 H-110 z" fill="#ffffff" rx="8" />
    <rect x="-130" y="-45" width="25" height="90" rx="6" fill="#818cf8" />
    <rect x="105" y="-45" width="25" height="90" rx="6" fill="#818cf8" />
    <rect x="-150" y="-30" width="15" height="60" rx="4" fill="#c7d2fe" />
    <rect x="135" y="-30" width="15" height="60" rx="4" fill="#c7d2fe" />
  </g>
</svg>
